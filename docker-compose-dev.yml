services:
    worker:
        build:
            context: .
            dockerfile_inline: |
                FROM node:26-alpine
                WORKDIR /usr/havujabot
                RUN npm i -g corepack@latest
                RUN corepack enable pnpm
                COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
                RUN pnpm install --frozen-lockfile
                COPY . .
                CMD ["pnpm", "run", "dev"]
        ports:
            - 8081:8081
        volumes:
            - .:/usr/havujabot
        depends_on:
            - pg
        env_file:
            - .env
        restart: always
    pg:
        image: postgres:alpine
        restart: always
        volumes:
            - postgresvolume01:/var/lib/postgresql/data
        env_file:
            - .env
        ## for local debugging
        ports:
            - '5432:5432'
volumes:
    postgresvolume01:
        driver: local
